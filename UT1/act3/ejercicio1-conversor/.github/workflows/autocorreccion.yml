name: Autocorrección

on:
  push:
  workflow_dispatch:

jobs:
  corregir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar autocorrección
        run: python3 calcular_nota.py

      - name: Mostrar nota
        if: always()
        run: cat target/nota.txt || true

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-autocorreccion
          path: target/nota.txt
